services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      RAG_MONGO_URI: mongodb://mongo:27017
      RAG_MONGO_DB: ${RAG_MONGO_DB:-rag_support}
      RAG_ENCRYPTION_KEY: ${RAG_ENCRYPTION_KEY:?Set RAG_ENCRYPTION_KEY in .env}
      RAG_BOOTSTRAP_ADMIN_USERNAME: ${RAG_BOOTSTRAP_ADMIN_USERNAME:-admin}
      RAG_BOOTSTRAP_ADMIN_PASSWORD: ${RAG_BOOTSTRAP_ADMIN_PASSWORD:?Set RAG_BOOTSTRAP_ADMIN_PASSWORD in .env}
      RAG_SESSION_TTL_HOURS: ${RAG_SESSION_TTL_HOURS:-8}
      RAG_COOKIE_SECURE: ${RAG_COOKIE_SECURE:-false}
      RAG_RETRIEVAL_TOP_K: ${RAG_RETRIEVAL_TOP_K:-4}
      RAG_HISTORY_TURNS: ${RAG_HISTORY_TURNS:-3}
      RAG_LLM_TIMEOUT_SECONDS: ${RAG_LLM_TIMEOUT_SECONDS:-60}
      RAG_LOG_LEVEL: ${RAG_LOG_LEVEL:-INFO}
      RAG_LOG_FORMAT: ${RAG_LOG_FORMAT:-json}
      RAG_DATA_POLICY_VERSION: ${RAG_DATA_POLICY_VERSION:-2026-10-08}
      RAG_CONVERSATION_RETENTION_DAYS: ${RAG_CONVERSATION_RETENTION_DAYS:-90}
      RAG_FEEDBACK_RETENTION_DAYS: ${RAG_FEEDBACK_RETENTION_DAYS:-90}
      RAG_AUDIT_RETENTION_DAYS: ${RAG_AUDIT_RETENTION_DAYS:-365}
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo-data:/home/thtran/rag-support-db
